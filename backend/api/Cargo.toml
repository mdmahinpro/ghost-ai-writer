[package]
name = "gaw-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
regex = "1"
ring = "0.17"
base64 = "0.22"
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Lint policy, per the BeautifulRust guidelines: enforced in CI with
# `cargo clippy --all-targets --all-features -- -D warnings`.
#
# This is a binary service, not a crate with external users, so the
# published-library subset is deliberately absent: `missing_docs`,
# `print_stdout`/`print_stderr`, `missing_errors_doc` and `unreachable_pub`
# (in a bin crate every `pub` item is formally unreachable, so the lint flags
# the whole crate rather than a mistake).
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
string_add = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"
