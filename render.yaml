# Render blueprint for Ghost AI Writer.
#
# Two services:
#   gaw-api              Rust backend (axum + sqlx). Docker, SQLite on a disk.
#   ghost-ai-writer-web  The existing TanStack Start app, built as a Nitro
#                        node-server bundle (same code that builds for Vercel).
#
# Apply with: Render dashboard -> New -> Blueprint -> this repo.
# GAW_ADMIN_TOKEN is generated by Render; read it in the service's Environment tab.

services:
  - type: web
    name: gaw-api
    runtime: docker
    plan: 0.5c-512mb          # cheapest paid instance: free cannot mount a disk
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/gaw.db?mode=rwc
      - key: ROLE
        value: all             # API + worker in one process
      - key: GAW_ADMIN_TOKEN
        generateValue: true    # required: every /api route is gated by it
      - key: GAW_ENC_KEY
        generateValue: true    # seals credentials in app_state; must never change
      - key: SEED
        value: "1"             # demo workspaces/sites; set to "" to start empty
    disk:
      name: gaw-data
      mountPath: /data
      sizeGB: 1

  # The SPA is a static bundle, not a Node server. `vite.config.ts` runs
  # tanstackStart({ spa: { enabled: true } }), because the Rust API is the only
  # backend — so the build emits `dist/client/` (prerendered index.html plus
  # hashed assets) and never writes `.output/server/index.mjs`. Starting `node
  # .output/server/index.mjs` therefore died with MODULE_NOT_FOUND. Serve the
  # directory instead; Render's CDN handles the SPA fallback for client routes.
  - type: web
    name: ghost-ai-writer-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: >-
      npm ci --no-audit --no-fund &&
      node scripts/with-app-env.mjs
      node ./node_modules/vite/bin/vite.js build
    staticPublishPath: ./dist/client
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
